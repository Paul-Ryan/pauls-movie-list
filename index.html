<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PWSWQZQV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
    </script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paul's Movie List</title>
    <!-- Set theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('theme-dark-init');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-PWSWQZQV"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <script>
      // Promote the pre-paint flag to the real dark-mode class once <body> exists.
      if (document.documentElement.classList.contains('theme-dark-init')) {
        document.body.classList.add('dark-mode');
      }
    </script>
    <div class="page">
      <header class="top">
        <div class="top-inner">
          <div class="top-row">
            <div>
              <h1 class="title">Paul's Movie List</h1>
              <p class="subtitle" id="subtitle">19 titles · 11 movies · 8 shows</p>
            </div>
            <div class="actions">
              <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
                <span class="icon-sun material-symbols-outlined">light_mode</span>
                <span class="icon-moon material-symbols-outlined">dark_mode</span>
              </button>
              <button id="share-btn" class="share-btn" type="button" aria-label="Copy link to this list">
                <span class="material-symbols-outlined" id="share-icon">link</span
                ><span id="share-label">Share</span>
              </button>
            </div>
          </div>
          <div class="search">
            <span class="material-symbols-outlined">search</span>
            <input id="search" type="text" placeholder="Search titles" aria-label="Search titles" autocomplete="off" />
          </div>
        </div>
      </header>
      <main id="list" aria-live="polite">
        <noscript>
          <p class="empty">This list needs JavaScript enabled to display.</p>
        </noscript>
      </main>
      <p class="footer">Shared list · updated 2026</p>
    </div>
    <script src="app.js" defer></script>
  </body>
  <footer>
    <!-- Quantcast Tag -->
    <script async src="https://secure.quantserve.com/quant.js"></script>
    <script>
      window._qevents = window._qevents || [];
      window._qevents.push({ qacct: 'p-AgTPffCW1Q-Jy' });
    </script>

    <noscript>
      <div style="display: none">
        <img
          src="//pixel.quantserve.com/pixel/p-AgTPffCW1Q-Jy.gif"
          border="0"
          height="1"
          width="1"
          alt="Quantcast"
        />
      </div>
    </noscript>
    <!-- End Quantcast tag -->
  </footer>
</html>
